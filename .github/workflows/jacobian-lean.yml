# Manual run for book7/JacobianCE.lean (see the note in lakefile.lean). Not on push, so it
# cannot affect the main verification gate. Trigger: Actions > "Jacobian counterexample (Lean)" > Run workflow.
name: Jacobian counterexample (Lean)  # also builds BraidDichotomy

on:
  workflow_dispatch:

jobs:
  jacobian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed; Mathlib will build from source"

      - name: Build JacobianCE and print axioms
        run: |
          set -euxo pipefail
          lake build JacobianCE 2>&1 | tee /tmp/jce.txt
          grep -n "sorry" /tmp/jce.txt && { echo "::error::sorry in output"; exit 1; } || true
          lake env lean book7/JacobianCE.lean 2>&1 | tee /tmp/jce-axioms.txt
          grep -n "depends on axioms" /tmp/jce-axioms.txt

      - name: Build BraidDichotomy and print axioms
        if: always()
        run: |
          set -euxo pipefail
          lake build BraidDichotomy 2>&1 | tee /tmp/bd.txt
          grep -n "sorry" /tmp/bd.txt && { echo "::error::sorry in output"; exit 1; } || true
          lake env lean book7/BraidDichotomy.lean 2>&1 | tee /tmp/bd-axioms.txt
          grep -n "depends on axioms" /tmp/bd-axioms.txt

      - name: Build P2xP2 (standard conjectures benchmark) and print axioms
        if: always()
        run: |
          set -euxo pipefail
          lake build P2xP2 2>&1 | tee /tmp/p2.txt
          grep -n "sorry" /tmp/p2.txt && { echo "::error::sorry in output"; exit 1; } || true
          lake env lean standard-conjectures/P2xP2.lean 2>&1 | tee /tmp/p2-axioms.txt
          grep -n "depends on axioms" /tmp/p2-axioms.txt
      - name: Build SpectralDiagonalBound and print axioms
        if: always()
        run: |
          set -euxo pipefail
          lake build SpectralDiagonalBound 2>&1 | tee /tmp/sdb.txt
          grep -n "sorry" /tmp/sdb.txt && { echo "::error::sorry in output"; exit 1; } || true
          lake env lean standard-conjectures/SpectralDiagonalBound.lean 2>&1 | tee /tmp/sdb-axioms.txt
          grep -n "depends on axioms" /tmp/sdb-axioms.txt
