  - id: wigner_crystal_2d
    name: "Wigner crystallization, two-dimensional electron gas"
    claim_level: analogical
    g_source_type: togt_identification
    f_test:
      rate_exponent: not_applicable
      hysteresis: not_applicable
      verdict: not_applicable
      evidence: "zero-temperature QMC energy comparison is a level crossing, not a dynamical saddle-node"
    source: "Drummond & Needs, arXiv:1002.2101 (2D phase diagram, QMC); values below as quoted in that abstract-level source"
    g_threshold: 33
    g_threshold_source: >
      TOGT identification. The domain values quoted in the source are rs = 31(1) a.u.
      (fluid to antiferromagnetic triangular crystal, that paper), 37(5) and 34(4)
      (earlier QMC values it quotes) and 35.1(9) (an experimental value it quotes).
      33 is not the centre of any bracket formed from these (the centre of [30, 40]
      is 35); it is the TOGT constant placed inside the spread of these numbers.
    domain_values:
      rs_star_qmc: "31(1)"
      rs_star_earlier_qmc: ["37(5)", "34(4)"]
      rs_star_experiment: "35.1(9)"
    togt_C: "Coulomb compression of the 2D electron fluid into a lattice (rs grows as density falls)"
    togt_K: "Wigner-Seitz cell geometry set by rs (a parameterisation, not a measured curvature)"
    togt_F: "Fluid-to-crystal transition at rs*. Order of the transition not established here: the source quotes an argument that the 2D transition cannot be first order."
    togt_U: "Triangular Wigner crystal (QMC ground state beyond rs*)"
    togt_E: "rs* between about 31 and 37 in the quoted values"
    parameters:
      mu_max: null
      omega: null
      beta: null
    parameter_status: >
      v8.1 listed mu_max = -0.31, omega = 0.19, beta = 1.7 as calibrated from
      Drummond et al. 2004. That paper is the 3D study; the values could not be traced
      to either cited paper, so they are removed here (unverified), not corrected.
    notes: >
      Split from wigner_crystal (v8.1) on 2026-11-06: the v8.1 row put the 2D numbers
      under a 3D citation. v8.1 also said 'Whitney A (fold) singularity class confirmed';
      no source was found, and a zero-temperature energy comparison between two phases
