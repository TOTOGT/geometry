text{font-family:Georgia,serif;fill:var(--fg)}
.n{font-size:20px} .p{font-size:16px;font-style:italic;fill:var(--muted)} .s{font-size:15px;fill:var(--muted)} .h{font:700 18px ui-monospace,Menlo,monospace}</style>
<rect width="1180" height="590" style="fill:var(--bg)"/>
<text x="190" y="54" text-anchor="middle" class="h">THE HAND</text>
<text x="760" y="54" text-anchor="middle" class="h">GROSSURA: SEVEN LAYERS</text>
<text x="760" y="76" text-anchor="middle" class="p">a cut through the palm, surface to bone</text>
<g transform="translate(40,70)" style="fill:var(--cL);fill-opacity:.18;stroke:var(--fg)" stroke-width="2.5" stroke-linejoin="round">
<rect x="70" y="190" width="200" height="190" rx="48"/>
<rect x="76" y="40" width="40" height="190" rx="20"/><rect x="124" y="14" width="42" height="215" rx="21"/>
<rect x="174" y="30" width="42" height="200" rx="21"/><rect x="222" y="70" width="38" height="165" rx="19"/>
<rect x="-110" y="-22" width="150" height="44" rx="22" transform="translate(88,318) rotate(38)"/>
</g>
<g transform="translate(40,70)" fill="none" style="stroke:var(--cW)" stroke-width="3.5" stroke-linecap="round">
<path d="M92 262 C130 238 190 238 250 258"/><path d="M96 296 C140 276 190 282 246 300"/><path d="M168 236 C150 290 160 330 176 366"/></g>
<text x="190" y="520" text-anchor="middle" class="n" style="fill:var(--cW)">the lines a palm reader reads</text>
<text x="190" y="544" text-anchor="middle" class="p">only the surface, a flat pattern</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cT)"/></marker></defs>
<circle cx="258" cy="372" r="6" style="fill:var(--cT)"/><line x1="258" y1="372" x2="598" y2="130" style="stroke:var(--fg)" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="610" y="100" width="300" height="50" style="fill:var(--cW);fill-opacity:1;stroke:var(--fg)" stroke-width="1.5"/><rect x="610" y="150" width="300" height="50" style="fill:var(--cL);fill-opacity:1;stroke:var(--fg)" stroke-width="1.5"/><rect x="610" y="200" width="300" height="50" style="fill:var(--cW);fill-opacity:0.55;stroke:var(--fg)" stroke-width="1.5"/><rect x="610" y="250" width="300" height="50" style="fill:var(--cH);fill-opacity:1;stroke:var(--fg)" stroke-width="1.5"/><rect x="610" y="300" width="300" height="50" style="fill:var(--cL);fill-opacity:0.6;stroke:var(--fg)" stroke-width="1.5"/><rect x="610" y="350" width="300" height="50" style="fill:var(--cT);fill-opacity:1;stroke:var(--fg)" stroke-width="1.5"/><rect x="610" y="400" width="300" height="50" style="fill:var(--bone);fill-opacity:1;stroke:var(--fg)" stroke-width="1.5"/><line x1="610" y1="150" x2="910" y2="150" style="stroke:var(--bg)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><line x1="610" y1="200" x2="910" y2="200" style="stroke:var(--bg)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><line x1="610" y1="250" x2="910" y2="250" style="stroke:var(--bg)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><line x1="610" y1="300" x2="910" y2="300" style="stroke:var(--bg)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><line x1="610" y1="350" x2="910" y2="350" style="stroke:var(--bg)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><line x1="610" y1="400" x2="910" y2="400" style="stroke:var(--bg)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><text x="932" y="123.0" class="n">1 · epidermis</text><text x="932" y="142.0" class="p">epiderme</text><text x="932" y="173.0" class="n">2 · dermis</text><text x="932" y="192.0" class="p">derme</text><text x="932" y="223.0" class="n">3 · hypodermis</text><text x="932" y="242.0" class="p">hipoderme</text><text x="932" y="273.0" class="n">4 · fascia</text><text x="932" y="292.0" class="p">fáscia</text><text x="932" y="323.0" class="n">5 · muscle</text><text x="932" y="342.0" class="p">músculo</text><text x="932" y="373.0" class="n">6 · periosteum</text><text x="932" y="392.0" class="p">periósteo</text><text x="932" y="423.0" class="n">7 · bone</text><text x="932" y="442.0" class="p">osso</text>
<line x1="580" y1="106" x2="580" y2="444" style="stroke:var(--cT)" stroke-width="4" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="560" y="275.0" text-anchor="middle" transform="rotate(-90 560 275.0)" class="n" style="fill:var(--cT)">move ana · move kata</text>
<text x="760" y="484" text-anchor="middle" class="s">dotted gaps: the interstitium, between every two layers (a metaphor; its status is debated)</text>
<text x="590" y="575" text-anchor="middle" class="s">Topology ignores how many layers we count: seven here, two in the 2×2×2×2 tesseract. This book's count of seven is a teaching choice.</text>
</svg>