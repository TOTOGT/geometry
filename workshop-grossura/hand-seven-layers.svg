<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 590" role="img" aria-label="A hand and its seven layers, epidermis to bone, along grossura">
<style>:root{--bg:#e9f8f7;--fg:#0b3b3a;--muted:#3f6f6d;--cL:#07a39e;--cW:#b8860b;--cH:#0b5f5c;--cT:#8a6410;--bone:#f2ead4}
